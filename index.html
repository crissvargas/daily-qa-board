<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily QA</title>
<script>
  // Aplica el tema antes de pintar la página para evitar un parpadeo.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem("qaDailyBoardTheme"); } catch (e) {}
    if (theme !== "dark" && theme !== "light") {
      theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #F7F8F9;
    --panel: #FFFFFF;
    --border: #DFE1E6;
    --text: #172B4D;
    --muted: #6B778C;
    --accent: #0052CC;
    --accent-hover: #0747A6;
    --accent-soft: #DEEBFF;
    --on-accent: #FFFFFF;
    --success: #00875A;
    --success-soft: #E3FCEF;
    --success-text: #006644;
    --danger: #DE350B;
    --danger-soft: #FFEBE6;
    --danger-soft-hover: #FFD9CC;
    --btn-bg: #F1F2F4;
    --btn-hover: #DCDFE4;
    --member-hover: rgba(255,255,255,0.5);
    --shadow: rgba(9,30,66,0.13);
    --squad-0: #FFF3B0; --squad-1: #FFD6E8; --squad-2: #CFE3FF; --squad-3: #E4D6FF;
    --squad-4: #FFDCC2; --squad-5: #D6F5D0; --squad-6: #D9F0F5;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1D2125;
    --panel: #22272B;
    --border: #38414A;
    --text: #DEE4EA;
    --muted: #9FADBC;
    --accent: #579DFF;
    --accent-hover: #85B8FF;
    --accent-soft: #09326C;
    --on-accent: #1D2125;
    --success: #1F845A;
    --success-soft: #164B35;
    --success-text: #7EE2B8;
    --danger: #F87168;
    --danger-soft: #42221F;
    --danger-soft-hover: #5D1F1A;
    --btn-bg: #2C333A;
    --btn-hover: #38414A;
    --member-hover: rgba(255,255,255,0.08);
    --shadow: rgba(0,0,0,0.4);
    --squad-0: #3A3416; --squad-1: #3E2433; --squad-2: #1C2B41; --squad-3: #2B2541;
    --squad-4: #3E2A1E; --squad-5: #1F3325; --squad-6: #1B3338;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  #root { min-height: 100vh; }

  .qa-board {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    width: 100%;
    padding: 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .qa-board * { box-sizing: border-box; }
  .qa-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 16px; margin-bottom: 20px;
  }
  .qa-title { font-size: 20px; font-weight: 700; color: var(--text); margin: 0 0 4px; }
  .qa-date { font-size: 14px; color: var(--muted); margin: 0 0 4px; }
  .qa-progress { font-size: 15px; color: var(--muted); margin: 4px 0 0; }
  .qa-progress b { color: var(--accent); }

  button.qa-btn {
    background: var(--btn-bg); border: 1px solid transparent; color: var(--text);
    padding: 9px 16px; border-radius: 3px; font-family: inherit; font-weight: 500;
    font-size: 14px; cursor: pointer; transition: background 0.12s ease;
  }
  button.qa-btn:hover { background: var(--btn-hover); }
  button.qa-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.qa-btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.qa-btn.primary:hover { background: var(--accent-hover); }
  button.qa-btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.qa-btn.ghost:hover { background: var(--btn-bg); }
  button.qa-btn.lime { background: #B7E64C; color: #234000; font-weight: 600; }
  button.qa-btn.lime:hover { background: #A6D93E; }
  button.qa-btn.rose { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
  button.qa-btn.rose:hover { background: var(--danger-soft-hover); }
  button.qa-btn.danger { background: transparent; color: var(--danger); padding: 5px 9px; font-size: 13px; }
  button.qa-btn.danger:hover { background: var(--danger-soft); }
  button.qa-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .qa-control-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 0 1px 2px var(--shadow); padding: 18px 22px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 22px; margin-bottom: 24px;
  }
  .qa-timer-block { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 150px; }
  .qa-eyebrow { font-size: 13px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .qa-current-name { font-size: 18px; font-weight: 600; }
  .qa-current-squad { font-size: 14px; color: var(--muted); }
  .qa-timer { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1; }
  .qa-timer.urgent { color: var(--danger); animation: qa-pulse 1s infinite; }
  @media (prefers-reduced-motion: reduce) { .qa-timer.urgent { animation: none; } }
  @keyframes qa-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .qa-controls-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .qa-duration-input { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .qa-duration-input input {
    width: 48px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 3px; padding: 4px 6px; font-family: inherit;
  }

  .qa-squads-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .qa-squad { border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 1px 2px var(--shadow); padding: 14px; transition: box-shadow 0.15s ease, border-color 0.15s ease; }
  .qa-squad.qa-squad-active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), 0 4px 10px var(--shadow); }
  .qa-squad-tone-0 { background: var(--squad-0); }
  .qa-squad-tone-1 { background: var(--squad-1); }
  .qa-squad-tone-2 { background: var(--squad-2); }
  .qa-squad-tone-3 { background: var(--squad-3); }
  .qa-squad-tone-4 { background: var(--squad-4); }
  .qa-squad-tone-5 { background: var(--squad-5); }
  .qa-squad-tone-6 { background: var(--squad-6); }
  .qa-squad-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .qa-squad-name { font-size: 13px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text); font-weight: 700; }
  .qa-squad-tally { font-size: 13px; font-weight: 700; color: var(--success-text); background: var(--success-soft); padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .qa-member-grid { display: flex; flex-wrap: wrap; gap: 12px; }
  .qa-member { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 76px; cursor: pointer; background: none; border: none; color: inherit; font-family: inherit; padding: 4px; border-radius: 6px; }
  .qa-member:hover { background: var(--member-hover); }
  .qa-member:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .qa-avatar {
    position: relative; width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #FFFFFF;
    border: 2px solid transparent; transition: box-shadow 0.12s ease;
  }
  .qa-member.active .qa-avatar { border-color: var(--panel); box-shadow: 0 0 0 4px var(--accent-soft); }
  .qa-check {
    position: absolute; bottom: -2px; right: -2px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--success); color: #FFFFFF; font-size: 11px;
    display: flex; align-items: center; justify-content: center; border: 2px solid var(--panel);
  }
  .qa-member-name { font-size: 13px; text-align: center; line-height: 1.25; color: var(--text); overflow-wrap: anywhere; }
  .qa-member.done .qa-member-name { color: var(--muted); }

  .qa-empty { text-align: center; padding: 56px 20px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 4px; }
  .qa-empty h3 { color: var(--text); font-size: 18px; margin-bottom: 8px; }
  .qa-empty-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

  .qa-edit-input {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 3px; padding: 5px 9px; font-family: inherit; font-size: 13px; width: 100%; margin-bottom: 4px;
  }
  .qa-note { font-size: 12px; color: var(--muted); margin-top: auto; padding-top: 18px; }

  @media (max-width: 900px) {
    .qa-squads-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .qa-squads-grid { grid-template-columns: 1fr; }
    .qa-timer { font-size: 40px; }
    .qa-board { padding: 16px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  "use strict";

  var AVATAR_COLORS = [
    "#0052CC", "#5243AA", "#00875A", "#FF5630", "#00A3BF",
    "#6554C0", "#36B37E", "#FF8B00", "#8777D9", "#4C9AFF",
  ];

  // Los colores de cada tono están en CSS (--squad-N) para que cambien con el tema.
  var SQUAD_TONE_COUNT = 7;

  var DEFAULT_DURATION = 120;
  var STORAGE_KEY = "qaDailyBoardConfig_v2";
  var THEME_KEY = "qaDailyBoardTheme";

  function colorForName(name) {
    var hash = 0;
    for (var i = 0; i < name.length; i++) {
      hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  }

  function toneClassForIndex(idx) {
    return "qa-squad-tone-" + (idx % SQUAD_TONE_COUNT);
  }

  function getTheme() {
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }

  function toggleTheme() {
    var next = getTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    render();
  }

  function initialsForName(name) {
    var parts = name.trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  function uid() {
    return "id-" + Date.now() + "-" + Math.floor(Math.random() * 100000);
  }

  function formatTime(totalSeconds) {
    var m = Math.floor(totalSeconds / 60);
    var s = totalSeconds % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function getTodayLabel() {
    var s = new Date().toLocaleDateString("es-PE", {
      weekday: "long", day: "numeric", month: "long", year: "numeric",
    });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function shuffleSquadMembers(squadList) {
    return shuffleArray(squadList).map(function (s) {
      return Object.assign({}, s, { members: shuffleArray(s.members) });
    });
  }

  var DEFAULT_SQUADS_DATA = [
    ["Squad Boton Web", ["Brandon Villanueva", "Sandro Villegas", "Daniel Espiritu","Carlos Chafloque"]],
    ["Squad SDK Movil", ["Jonathan Picon","Carolina Meza"]],
    ["Squad Tokenización", ["Kenyo Solis", "Juan Carlos Araujo"]],
    ["Squad Recurrentes", ["Victoria Farah","Joan Aquino", "Kevin Yenque"]],
    ["Squad Procesamiento", ["Keyko Soto", "Ray Reyes", "Gustavo Espino", "Jair Araujo"]],
    ["Squad CMS Opensource & Developers", ["Fabiola Tapara","Sharon Maiz"]],
  ];

  // Se recalcula sola a partir de DEFAULT_SQUADS_DATA: si edita esa lista en el
  // código y publica, cambia el string y con eso se invalida cualquier
  // configuración de equipos guardada en el navegador de cada persona.
  var DEFAULT_SQUADS_SIGNATURE = JSON.stringify(DEFAULT_SQUADS_DATA);

  function buildDefaultSquads() {
    return DEFAULT_SQUADS_DATA.map(function (pair) {
      return {
        id: uid(),
        name: pair[0],
        members: pair[1].map(function (m) { return { id: uid(), name: m }; }),
      };
    });
  }

  // ---------------- state ----------------
  var squads = [];
  var duration = DEFAULT_DURATION;
  var timeLeft = DEFAULT_DURATION;
  var currentIdx = 0;
  var isRunning = false;
  var doneIds = {};
  var editMode = false;
  var storageError = false;
  var tickHandle = null;
  var saveTimer = null;

  function loadConfig() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function saveConfigNow() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        squads: squads,
        duration: duration,
        signature: DEFAULT_SQUADS_SIGNATURE,
      }));
      return true;
    } catch (e) {
      return false;
    }
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      storageError = !saveConfigNow();
      var el = document.getElementById("qa-footer-error");
      if (el) el.textContent = storageError ? "No se pudo guardar el último cambio." : "";
    }, 300);
  }

  function getOrder() {
    var out = [];
    squads.forEach(function (s) {
      s.members.forEach(function (m) {
        out.push({ id: m.id, name: m.name, squadId: s.id, squadName: s.name });
      });
    });
    return out;
  }

  function findNextUndone(order, fromIdx) {
    if (order.length === 0) return 0;
    for (var step = 1; step <= order.length; step++) {
      var idx = (fromIdx + step) % order.length;
      if (!doneIds[order[idx].id]) return idx;
    }
    return (fromIdx + 1) % order.length;
  }

  function clearTick() {
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  }

  function updateTimerDisplay() {
    var el = document.getElementById("qa-timer-value");
    if (!el) return;
    el.textContent = formatTime(timeLeft);
    var urgent = isRunning && timeLeft <= 10 && timeLeft > 0;
    el.classList.toggle("urgent", urgent);
  }

  function startTick() {
    clearTick();
    tickHandle = setInterval(function () {
      timeLeft = timeLeft > 0 ? timeLeft - 1 : 0;
      updateTimerDisplay();
      if (timeLeft === 0) {
        clearTick();
        advance();
      }
    }, 1000);
  }

  function advance() {
    isRunning = false;
    clearTick();
    var order = getOrder();
    var current = order[currentIdx];
    if (current) doneIds[current.id] = true;
    currentIdx = findNextUndone(order, currentIdx);
    timeLeft = duration;
    render();
  }

  function selectMember(idx) {
    var order = getOrder();
    // Si el turno actual ya corrió más de un segundo y se elige a otra persona,
    // se da por llamado sin tener que pasar por "Detener".
    var current = order[currentIdx];
    if (isRunning && current && idx !== currentIdx && duration - timeLeft > 1) {
      doneIds[current.id] = true;
    }
    isRunning = false;
    clearTick();
    var id = order[idx] && order[idx].id;
    if (id && doneIds[id]) delete doneIds[id];
    currentIdx = idx;
    timeLeft = duration;
    render();
  }

  function goPrev() {
    var order = getOrder();
    if (order.length === 0) return;
    isRunning = false;
    clearTick();
    currentIdx = (currentIdx - 1 + order.length) % order.length;
    // Volver a alguien lo desmarca, para poder repetir su turno.
    delete doneIds[order[currentIdx].id];
    timeLeft = duration;
    render();
  }

  function toggleRun() {
    var order = getOrder();
    if (!order[currentIdx]) return;
    if (isRunning) {
      advance();
    } else {
      isRunning = true;
      startTick();
      render();
    }
  }

  function resetMeeting() {
    doneIds = {};
    currentIdx = 0;
    timeLeft = duration;
    isRunning = false;
    clearTick();
    render();
  }

  function restoreDefaults() {
    squads = shuffleSquadMembers(buildDefaultSquads());
    doneIds = {};
    currentIdx = 0;
    isRunning = false;
    clearTick();
    saveConfigNow();
    render();
  }

  function toggleEditMode() {
    editMode = !editMode;
    render();
  }

  function addSquad() {
    squads.push({ id: uid(), name: "Nuevo squad", members: [] });
    editMode = true;
    saveConfigNow();
    render();
  }

  function removeSquad(squadId) {
    squads = squads.filter(function (s) { return s.id !== squadId; });
    var order = getOrder();
    if (currentIdx >= order.length) currentIdx = 0;
    saveConfigNow();
    render();
  }

  function renameSquad(squadId, name) {
    var s = squads.find(function (s) { return s.id === squadId; });
    if (s) s.name = name;
    scheduleSave();
  }

  function addMember(squadId) {
    var s = squads.find(function (s) { return s.id === squadId; });
    if (s) s.members.push({ id: uid(), name: "" });
    saveConfigNow();
    render();
  }

  function renameMember(squadId, memberId, name) {
    var s = squads.find(function (s) { return s.id === squadId; });
    if (!s) return;
    var m = s.members.find(function (m) { return m.id === memberId; });
    if (m) m.name = name;
    scheduleSave();
  }

  function removeMember(squadId, memberId) {
    var s = squads.find(function (s) { return s.id === squadId; });
    if (s) s.members = s.members.filter(function (m) { return m.id !== memberId; });
    var order = getOrder();
    if (currentIdx >= order.length) currentIdx = 0;
    saveConfigNow();
    render();
  }

  function onDurationChange(value) {
    var mins = Math.max(1, Number(value) || 1);
    duration = mins * 60;
    if (!isRunning) {
      timeLeft = duration;
      updateTimerDisplay();
    }
    scheduleSave();
  }

  // ---------------- rendering ----------------
  function render() {
    var order = getOrder();
    if (currentIdx >= order.length && order.length > 0) currentIdx = 0;
    var current = order[currentIdx];
    var doneCount = Object.keys(doneIds).filter(function (id) {
      return order.some(function (o) { return o.id === id; });
    }).length;

    var html = "";
    html += '<div class="qa-header">';
    html += '<div>';
    html += '<p class="qa-title">Daily QA</p>';
    html += '<p class="qa-date">' + escapeHtml(getTodayLabel()) + '</p>';
    html += '<p class="qa-progress">Llamados <b>' + doneCount + '</b> / ' + order.length + '</p>';
    html += '</div>';
    html += '<div class="qa-controls-row">';
    var isDark = getTheme() === "dark";
    html += '<button class="qa-btn ghost" data-action="toggle-theme" aria-label="Cambiar a modo ' + (isDark ? "claro" : "oscuro") + '">' + (isDark ? "☀️ Modo claro" : "🌙 Modo oscuro") + '</button>';
    if (!editMode) {
      html += '<button class="qa-btn ghost" data-action="toggle-edit">Editar equipos</button>';
    } else {
      html += '<button class="qa-btn rose" data-action="restore-defaults">Restaurar valores por defecto</button>';
    }
    html += '<button class="qa-btn ghost" data-action="reset-meeting" ' + (order.length === 0 ? "disabled" : "") + '>Reiniciar reunión</button>';
    html += '</div>';
    html += '</div>';

    if (squads.length === 0) {
      html += '<div class="qa-empty">';
      html += '<h3>No hay squads configurados</h3>';
      html += '<p>Crea un squad o restaura los valores por defecto del código.</p>';
      html += '<div class="qa-empty-actions">';
      html += '<button class="qa-btn primary" data-action="add-squad">+ Crear squad</button>';
      html += '<button class="qa-btn rose" data-action="restore-defaults">Restaurar valores por defecto</button>';
      html += '</div></div>';
    } else {
      html += '<div class="qa-control-panel">';
      html += '<div class="qa-timer-block">';
      html += '<span class="qa-eyebrow">En turno</span>';
      html += '<span class="qa-current-name">' + escapeHtml(current ? (current.name || "Sin nombre") : "—") + '</span>';
      html += '<span class="qa-current-squad">' + escapeHtml(current ? current.squadName : "Selecciona a alguien") + '</span>';
      html += '</div>';
      html += '<div class="qa-timer" id="qa-timer-value">' + formatTime(timeLeft) + '</div>';
      html += '<div class="qa-controls-row">';
      html += '<button class="qa-btn ghost" data-action="go-prev" ' + (order.length === 0 ? "disabled" : "") + '>← Anterior</button>';
      html += '<button class="qa-btn primary" data-action="toggle-run" ' + (!current ? "disabled" : "") + '>' + (isRunning ? "■ Detener" : "▶ Iniciar") + '</button>';
      html += '<div class="qa-duration-input">Min/persona<input type="number" min="1" max="30" id="qa-duration-input" value="' + Math.round(duration / 60) + '" /></div>';
      html += '</div></div>';

      html += '<div class="qa-squads-grid">';
      squads.forEach(function (squad, index) {
        var doneInSquad = squad.members.filter(function (m) { return doneIds[m.id]; }).length;
        var isSquadActive = !editMode && current && current.squadId === squad.id;
        html += '<div class="qa-squad ' + toneClassForIndex(index) + (isSquadActive ? " qa-squad-active" : "") + '">';
        html += '<div class="qa-squad-head">';
        if (editMode) {
          html += '<input class="qa-edit-input" data-input="squad-name" data-squad="' + squad.id + '" value="' + escapeHtml(squad.name) + '" placeholder="Nombre del squad" />';
          html += '<button class="qa-btn danger" data-action="remove-squad" data-squad="' + squad.id + '">Eliminar</button>';
        } else {
          html += '<span class="qa-squad-name">' + escapeHtml(squad.name) + '</span>';
          html += '<span class="qa-squad-tally">' + doneInSquad + '/' + squad.members.length + '</span>';
        }
        html += '</div>';
        html += '<div class="qa-member-grid">';
        squad.members.forEach(function (m) {
          var idx = order.findIndex(function (o) { return o.id === m.id; });
          var isActive = idx === currentIdx && idx !== -1;
          var isDone = !!doneIds[m.id];
          if (editMode) {
            html += '<div style="width:110px">';
            html += '<input class="qa-edit-input" data-input="member-name" data-squad="' + squad.id + '" data-member="' + m.id + '" value="' + escapeHtml(m.name) + '" placeholder="Nombre" />';
            html += '<button class="qa-btn danger" style="width:100%" data-action="remove-member" data-squad="' + squad.id + '" data-member="' + m.id + '">Quitar</button>';
            html += '</div>';
          } else {
            html += '<button class="qa-member' + (isActive ? " active" : "") + (isDone ? " done" : "") + '" data-action="select-member" data-idx="' + idx + '">';
            html += '<span class="qa-avatar" style="background:' + colorForName(m.name || "?") + '">';
            html += escapeHtml(initialsForName(m.name || "?"));
            if (isDone) html += '<span class="qa-check">✓</span>';
            html += '</span>';
            html += '<span class="qa-member-name">' + escapeHtml(m.name || "Sin nombre") + '</span>';
            html += '</button>';
          }
        });
        if (editMode) {
          html += '<button class="qa-btn ghost" data-action="add-member" data-squad="' + squad.id + '" style="height:40px;align-self:center">+ Persona</button>';
        }
        html += '</div></div>';
      });
      html += '</div>';

      if (editMode) {
        html += '<div style="margin-top:16px;display:flex;gap:10px">';
        html += '<button class="qa-btn primary" data-action="add-squad">+ Agregar squad</button>';
        html += '<button class="qa-btn lime" data-action="toggle-edit">Listo</button>';
        html += '</div>';
      }
    }

    html += '<p class="qa-note">Los squads por defecto vienen definidos. Si los editas desde la web, el cambio se guarda solo en este navegador. <span id="qa-footer-error">' + (storageError ? "No se pudo guardar el último cambio." : "") + '</span></p>';

    var root = document.getElementById("root");
    root.className = "qa-board";
    root.innerHTML = html;

    var durationInput = document.getElementById("qa-duration-input");
    if (durationInput) {
      durationInput.addEventListener("input", function (e) {
        onDurationChange(e.target.value);
      });
    }
    updateTimerDisplay();
  }

  // ---------------- event delegation ----------------
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var squadId = el.getAttribute("data-squad");
    var memberId = el.getAttribute("data-member");
    var idx = el.getAttribute("data-idx");

    if (action === "toggle-theme") toggleTheme();
    else if (action === "toggle-edit") toggleEditMode();
    else if (action === "reset-meeting") resetMeeting();
    else if (action === "restore-defaults") restoreDefaults();
    else if (action === "add-squad") addSquad();
    else if (action === "remove-squad") removeSquad(squadId);
    else if (action === "add-member") addMember(squadId);
    else if (action === "remove-member") removeMember(squadId, memberId);
    else if (action === "go-prev") goPrev();
    else if (action === "toggle-run") toggleRun();
    else if (action === "select-member" && idx !== null) selectMember(Number(idx));
  });

  document.addEventListener("input", function (e) {
    var type = e.target.getAttribute("data-input");
    if (type === "squad-name") {
      renameSquad(e.target.getAttribute("data-squad"), e.target.value);
    } else if (type === "member-name") {
      renameMember(e.target.getAttribute("data-squad"), e.target.getAttribute("data-member"), e.target.value);
    }
  });

  // ---------------- init ----------------
  var parsed = loadConfig();
  if (parsed && Array.isArray(parsed.squads) && parsed.signature === DEFAULT_SQUADS_SIGNATURE) {
    squads = shuffleSquadMembers(parsed.squads);
    duration = parsed.duration || DEFAULT_DURATION;
    timeLeft = duration;
  } else {
    squads = shuffleSquadMembers(buildDefaultSquads());
  }
  render();
})();
</script>
</body>
</html>
